<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Document Base / Shield with folded corner -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#102C3C" />
  
  <!-- Subtle Document Lines / Layers in Navy Accent -->
  <path d="M12 14H24" stroke="#173B4F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12 20H20" stroke="#173B4F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pilot Paper Plane / Supersonic Navigation Wing -->
  <!-- Left Wing (Sky Blue) -->
  <path d="M38 10L14 26L25 29L38 10Z" fill="#8AC8F9"/>
  
  <!-- Center Keel & Right Wing (Mint) -->
  <path d="M38 10L25 29L28 38L38 10Z" fill="#B8F2DC"/>
  
  <!-- Aerodynamic Fold Shadow (Deep Contrast) -->
  <path d="M25 29L22 35L28 38L25 29Z" fill="#173B4F"/>

  <!-- Dynamic Guideline / Motion Trail -->
  <circle cx="15" cy="37" r="1.5" fill="#8AC8F9" opacity="0.8"/>
  <circle cx="19" cy="34" r="1.8" fill="#B8F2DC" opacity="0.9"/>
</svg>
